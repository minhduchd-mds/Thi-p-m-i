name: Hỷ Studio Live Backend Smoke
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-publish-smoke.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Confirm Vercel routes to Supabase and invitation viewer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,time,urllib.request,urllib.error
          root="https://hy-studio-preview.vercel.app"
          urls=[
              "https://ogzwyibvvsvuufoghudl.supabase.co/functions/v1/studio-api/api/health",
              root+"/api/health",
              root+"/i/HY-ABCDEFGHJKL",
              root+"/studio.html"
          ]
          for target in urls:
              try:
                  with urllib.request.urlopen(target,timeout=15) as r:
                      sample=r.read(400).decode("utf-8","replace")
                      print("DIAG",r.status,target,repr(sample),flush=True)
              except urllib.error.HTTPError as e:
                  print("DIAG",e.code,target,repr(e.read(400).decode("utf-8","replace")),flush=True)
              except Exception as e:
                  print("DIAG ERROR",target,str(e)[:160],flush=True)
          data=None
          for attempt in range(4):
              try:
                  with urllib.request.urlopen(root+"/api/health", timeout=18) as r:
                      payload=json.loads(r.read())
                  if payload.get("storage")=="supabase-postgres":
                      data=payload
                      break
                  print("Waiting for Supabase proxy; health response:",str(payload)[:260])
              except Exception as e:
                  print("Health retry",attempt+1,str(e)[:180])
              time.sleep(5)
          assert data and data.get("publicCodes") is True, "Vercel /api/* rewrite does not reach studio-api"
          print("PASS: /api/health served by Supabase Edge Function")
          with urllib.request.urlopen(root+"/i/HY-ABCDEFGHJKL",timeout=18) as r:
              html=r.read().decode("utf-8")
              status=r.status
          assert status==200 and 'id="viewer"' in html and 'view.mjs' in html, "Short-code page rewrite missing"
          print("PASS: /i/HY-... routed to wedding viewer")
          PY

      - name: Verify production short-code lifecycle through Vercel and Supabase
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request, urllib.error, json, re
          root="https://hy-studio-preview.vercel.app"
          def call(path,method="GET",payload=None,token=None):
              data=json.dumps(payload).encode() if payload is not None else (b'' if method=="POST" else None)
              headers={"Content-Type":"application/json"} if data is not None else {}
              if token:headers["Authorization"]="Bearer "+token
              request=urllib.request.Request(root+path,data=data,headers=headers,method=method)
              try:
                  with urllib.request.urlopen(request,timeout=25) as response:
                      return response.status,json.loads(response.read())
              except urllib.error.HTTPError as e:
                  return e.code,json.loads(e.read())
          document={
              "schemaVersion":2,"theme":"red","layoutId":"test-publication",
              "fields":{"bride":"Hy Studio QA","groom":"Test Invitation","date":"2027-02-14",
                        "time":"18:00","venue":"E2E Lab","address":"Ha Noi","message":"Automated test"},
              "music":"none","blocks":[],"insideBlocks":[],"extraPages":[],"gift":{}
          }
          status,created=call("/api/cards","POST",{"data":{"document":document}})
          assert status==201,(status,str(created)[:330])
          card_id,code,token=created["id"],created["code"],created["editToken"]
          assert re.fullmatch(r"HY-[A-HJ-NP-Z2-9]{12}",code)
          try:
              status,card=call("/api/cards/"+code)
              assert status==200 and card["code"]==code and card["id"]==card_id,(status,card)
              status,info=call("/api/cards/"+card_id+"/manage",token=token)
              assert status==200 and info["code"]==code
              status,renew=call("/api/cards/"+card_id+"/extend","POST",{},token)
              assert status==200 and renew.get("expiresAt")
              status,revoked=call("/api/cards/"+card_id+"/revoke","POST",{},token)
              assert status==200 and revoked["revoked"] is True
              status,blocked=call("/api/cards/"+code)
              assert status==410,(status,blocked)
              status,restored=call("/api/cards/"+card_id+"/restore","POST",{},token)
              assert status==200 and restored["revoked"] is False
              status,card=call("/api/cards/"+code)
              assert status==200
              print("PASS: live publish, unique HY code, owner manage, extend, revoke, restore, read")
          finally:
              status,_=call("/api/cards/"+card_id+"/revoke","POST",{},token)
              assert status==200,"Failed to revoke QA invitation after smoke test"
              print("QA invitation has been revoked. It will expire under normal retention.")
          PY
