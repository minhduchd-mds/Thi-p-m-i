name: Hỷ Studio Live Backend Smoke
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-publish-smoke.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Confirm Vercel routes to Supabase and invitation viewer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,time,urllib.request,urllib.error
          root="https://hy-studio-preview.vercel.app"
          data=None
          for attempt in range(15):
              try:
                  with urllib.request.urlopen(root+"/api/health", timeout=18) as r:
                      payload=json.loads(r.read())
                  if payload.get("storage")=="supabase-postgres":
                      data=payload
                      break
                  print("Waiting for Supabase proxy; health response:",str(payload)[:260])
              except Exception as e:
                  print("Health retry",attempt+1,str(e)[:180])
              time.sleep(5)
          assert data and data.get("publicCodes") is True, "Vercel /api/* rewrite does not reach studio-api"
          print("PASS: /api/health served by Supabase Edge Function")
          with urllib.request.urlopen(root+"/i/HY-ABCDEFGHJKL",timeout=18) as r:
              html=r.read().decode("utf-8")
              status=r.status
          assert status==200 and 'id="viewer"' in html and 'view.mjs' in html, "Short-code page rewrite missing"
          print("PASS: /i/HY-... routed to wedding viewer")
          PY
