name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hy-studio-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Validate server syntax
        run: npm run check
      - name: Validate 3D scene SVG and music asset
        run: |
          python3 -c "import xml.etree.ElementTree as ET; from pathlib import Path; [ET.parse(str(f)) for f in [Path('public/hy-courtyard.svg'), *Path('public/assets/ornaments').glob('*.svg')]]; print('SVG scenes valid')"
          test -s public/assets/music/duyen-ngoc-phuong-dong.mp3
          test -s public/hy-gateway.css
          test -s public/hy-gateway.js
      - name: Run API integration tests
        shell: bash
        run: |
          set -euo pipefail
          node server.js > /tmp/hy-studio-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for _ in {1..20}; do
            if curl -fsS http://localhost:4177/api/health > /dev/null; then break; fi
            sleep .5
          done
          npm run test:api

      - name: Smoke test editor in headless browser
        shell: bash
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$BROWSER" ]; then
            echo "Chrome/Chromium not installed on runner; browser smoke not executed"
            exit 0
          fi
          node server.js > /tmp/hy-studio-browser-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for _ in {1..20}; do
            if curl -fsS http://127.0.0.1:4177/studio.html >/dev/null; then break; fi
            sleep .5
          done
          "$BROWSER" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --virtual-time-budget=10000 --window-size=1366,900 --dump-dom http://127.0.0.1:4177/studio.html > /tmp/hy-studio-browser-dom.html 2>/tmp/hy-studio-browser-log.txt
          grep -q 'class="stage-block' /tmp/hy-studio-browser-dom.html
          grep -q 'class="asset-card' /tmp/hy-studio-browser-dom.html
          echo "PASS: 1366px editor renders dynamic canvas layers and asset catalog in Chrome"

  browser-e2e:
    name: Playwright E2E · Drag/Drop · Themes · Export · RSVP
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Install Playwright test runner
        run: npm install --no-save --no-audit --no-fund @playwright/test@1.56.1
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Run functional + visual E2E
        run: npx playwright test --config=playwright.config.mjs
        env:
          CI: 'true'
      - name: Upload screenshots, traces and HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hy-studio-playwright-${{ github.run_number }}
          path: |
            test-results/
            playwright-report/
          retention-days: 14
          if-no-files-found: warn
