name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate server syntax
        run: npm run check
      - name: Validate 3D scene SVG and music asset
        run: |
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('public/hy-courtyard.svg'); print('SVG scene valid')"
          test -s public/assets/music/duyen-ngoc-phuong-dong.mp3
          test -s public/hy-gateway.css
          test -s public/hy-gateway.js
      - name: Run API integration tests
        shell: bash
        run: |
          set -euo pipefail
          node server.js > /tmp/hy-studio-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for _ in {1..20}; do
            if curl -fsS http://localhost:4177/api/health > /dev/null; then break; fi
            sleep .5
          done
          npm run test:api
