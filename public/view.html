<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thiệp mời · Hỷ Studio</title><meta name="theme-color" content="#fbf4ed">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Dancing+Script:wght@500;600;700&family=Noto+Serif:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;background:#eee3d7;color:#423029;font-family:'Be Vietnam Pro',sans-serif}
header{display:flex;align-items:center;justify-content:space-between;padding:15px clamp(14px,4vw,45px);background:#fff9f3;border-bottom:1px solid #e6d5c3}
header a{text-decoration:none;color:#933943;font-weight:800}header span{font-size:11px;color:#957d6a}
main{max-width:900px;margin:25px auto 50px;padding:0 12px}
#loading{text-align:center;color:#826f66;padding:60px 0;font-size:13px}
.viewer{display:flex;flex-direction:column;align-items:center;gap:16px}
#poster-wrap{position:relative;width:360px;height:540px;flex:none}
#poster{width:720px;height:1080px;transform-origin:top left;overflow:hidden;position:relative;background:#9b2e43;box-shadow:0 16px 47px #49332045;user-select:none}
.stage-block{position:absolute;display:flex;align-items:center;justify-content:center;white-space:pre-wrap;line-height:1.32;overflow:visible}
.stage-block img{width:100%;height:100%;display:block;pointer-events:none}
.panel{width:min(540px,100%);background:#fffdf8;border-radius:16px;padding:22px;box-shadow:0 5px 23px #5f331218}
.panel h2{font:600 22px 'Noto Serif',serif;color:#8c3f48;margin:0 0 12px}.panel p{font-size:12px;line-height:1.85;color:#846e60}
.panel button{border:0;background:#973b49;color:white;border-radius:8px;min-height:40px;padding:9px 18px;font:600 12px 'Be Vietnam Pro',sans-serif;cursor:pointer}
.panel .subtle{background:#f6eae1;color:#713e42}
.action-row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.rsvp{display:grid;gap:10px}.rsvp label{font-size:11px;font-weight:700;color:#786356}
.rsvp input,.rsvp select,.rsvp textarea{width:100%;border:1px solid #e1d3c8;border-radius:7px;padding:10px;background:white;font:12px 'Be Vietnam Pro',sans-serif}
.rsvp textarea{min-height:85px;resize:vertical}#result{font-size:11px;color:#876f63;padding:8px 0}
@media(max-width:500px){header{padding:13px 15px}main{margin:10px auto 25px}.panel{padding:18px}}
</style></head>
<body><header><a href="/">囍 Hỷ Studio</a><span>THƯ MỜI TRÂN TRỌNG</span></header>
<main><div id="loading">Đang chuẩn bị tấm thiệp dành cho bạn…</div><div id="viewer" class="viewer" hidden>
<div id="poster-wrap"><div id="poster" aria-label="Thiệp mời"></div></div>
<div class="panel"><h2 id="invitation-title">Trân trọng kính mời</h2><p id="invitation-intro"></p><div class="action-row"><button id="music">♫ Bật nhạc nền</button><button id="share" class="subtle">Chia sẻ thiệp</button></div></div>
<div class="panel"><h2>Xác nhận tham dự & lời chúc</h2><form id="rsvp" class="rsvp">
<label for="guest-name">Tên khách mời</label><input id="guest-name" maxlength="60" required placeholder="Tên của bạn">
<label for="attendance">Bạn có tham dự không?</label><select id="attendance"><option value="yes">Tôi sẽ tham dự</option><option value="no">Rất tiếc tôi không thể đến</option><option value="wish">Chỉ gửi lời chúc</option></select>
<label for="guests">Số khách tham dự</label><select id="guests"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select>
<label for="wish">Lời chúc</label><textarea id="wish" maxlength="500" placeholder="Gửi những lời yêu thương…"></textarea>
<button type="submit">Gửi phản hồi ♡</button></form><div id="result" role="status" aria-live="polite"></div></div></div>
<audio id="audio" preload="none" loop></audio></main>
<script type="module" src="/view.mjs?v=2.0.0"></script></body></html>
